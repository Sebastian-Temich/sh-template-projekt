name: Deploy produkcyjny

on:
  workflow_dispatch:
    inputs:
      wersja:
        description: Tag lub commit do wdrożenia
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # GitHub bez reguły required_reviewers uruchomiłby deploy bez akceptacji.
  # Plan konta może jej nie obsługiwać w repo prywatnym, dlatego brak reguły blokuje deploy.
  bramka:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wymagana akceptacja w environment production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reguly="$(gh api "repos/$GITHUB_REPOSITORY/environments/production" \
            --jq '[.protection_rules[]?.type] | join(",")')"
          echo "Reguły production: ${reguly:-brak}"
          case ",$reguly," in
            *,required_reviewers,*) ;;
            *)
              echo "::error::Environment production nie ma wymaganej akceptacji. Deploy zablokowany."
              exit 1
              ;;
          esac

  deploy:
    needs: bramka
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.wersja }}
      - name: Migracje bazy (placeholder)
        run: echo "Placeholder. Migracje produkcyjne zależne od hostingu projektu."
      - name: Deploy aplikacji (placeholder)
        run: echo "Placeholder. Deploy zależny od hostingu projektu."
      - name: Smoke test (placeholder)
        run: echo "Placeholder. Test dymny produkcji."
