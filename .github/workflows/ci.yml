# Runner: zmienna repo SH_RUNS_ON (JSON, np. ["self-hosted","sh-imac"] w repo prywatnym, ustawia shctl
# new-project --prywatny); bez niej ubuntu-24.04 GitHuba.
# Oszczędność minut (sh-system/docs/serwer.md, „CI i minuty GitHub Actions”):
# - check-dod i gitleaks działają zawsze (PR, push na main, ręcznie); na pushu gitleaks jest krokiem
#   joba check-dod (jeden job = jedna minuta zamiast dwóch);
# - lint i test tylko na PR ze zmianą poza docs/ i *.md, nocą po świeżych commitach i ręcznie;
# - e2e tylko przy zmianie kodu aplikacji (poza WZORCE_BEZ_E2E) i gdy jest playwright.config.*;
#   przeglądarki z cache, kroki z własnym limitem czasu i komunikatem ::error zamiast przerwania joba;
# - po merge'u na main (i po commitach orkiestratora) tylko smoke: jeden job check-dod z gitleaks.
# Testy skryptów szablonu (scripts/tests) działają tylko w repo sh-template-projekt (szablon.yml).
# Zadanie szkieletu zastępuje kroki placeholderów, ale zostawia needs, if i timeout-minutes.
# Każdy nowy job dostaje timeout-minutes oraz needs: check-dod i if jak lint
# (scripts/tests/ci-workflow.bats).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-dod:
    runs-on: ${{ fromJSON(vars.SH_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    outputs:
      kod: ${{ steps.zakres.outputs.kod }}
      e2e: ${{ steps.zakres.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Zakres zmian
        id: zakres
        env:
          ZDARZENIE: ${{ github.event_name }}
          BAZA: ${{ github.event.pull_request.base.sha }}
          GLOWA: ${{ github.event.pull_request.head.sha }}
          WZORCE_DOCS: "docs/* *.md"
          WZORCE_BEZ_E2E: "scripts/* .claude/* .github/ISSUE_TEMPLATE/* .github/workflows/staging.yml .github/workflows/deploy-prod.yml"
        run: bash scripts/ci-zakres.sh
      - name: DoD etapów
        run: bash scripts/check-dod.sh
      - name: Instalacja gitleaks (push)
        if: github.event_name == 'push'
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archiwum="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archiwum" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archiwum}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archiwum" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archiwum" -C "$RUNNER_TEMP" gitleaks
      - name: Skan historii gitleaks (push)
        if: github.event_name == 'push'
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'

  lint:
    needs: check-dod
    if: needs.check-dod.outputs.kod == 'true'
    runs-on: ${{ fromJSON(vars.SH_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint (placeholder)
        run: echo "Placeholder. Zadanie szkieletu wstawia tu lint projektu."

  test:
    needs: check-dod
    if: needs.check-dod.outputs.kod == 'true'
    runs-on: ${{ fromJSON(vars.SH_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Testy (placeholder)
        run: echo "Placeholder. Zadanie szkieletu wstawia tu testy projektu."

  e2e:
    needs: check-dod
    if: needs.check-dod.outputs.e2e == 'true'
    runs-on: ${{ fromJSON(vars.SH_RUNS_ON || '"ubuntu-24.04"') }}
    # Zapas nad limitami kroków niżej: job kończy krok z komunikatem, zanim GitHub go przerwie.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalacja
        run: pnpm install --frozen-lockfile
      - name: Wersja Playwright
        id: pw
        run: echo "wersja=$(pnpm exec playwright --version | awk '{print $2}')" >>"$GITHUB_OUTPUT"
      - name: Cache przeglądarek Playwright
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.wersja }}-chromium-webkit
      - name: Przeglądarki Playwright (chromium + webkit)
        env:
          TRAFIENIE: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          # Z cache tylko zależności systemowe (apt), bez cache także pobranie przeglądarek.
          if [ "$TRAFIENIE" = true ]; then set -- install-deps; else set -- install --with-deps; fi
          kod=0
          timeout 8m pnpm exec playwright "$@" chromium webkit || kod=$?
          if [ "$kod" -ne 0 ]; then
            echo "::error title=Instalacja przeglądarek Playwright::playwright $1 przerwany po 8 min albo nieudany (kod $kod; sieć, CDN, apt). To nie jest błąd kodu PR: ponów job poleceniem gh run rerun ${{ github.run_id }} --failed."
            exit 1
          fi
      - name: Testy E2E
        run: |
          kod=0
          timeout 12m pnpm test:e2e || kod=$?
          if [ "$kod" -eq 124 ]; then
            echo "::error title=Limit czasu E2E::testy E2E trwały ponad 12 min i zostały zatrzymane. Szukaj zawieszonego testu albo serwera podglądu w artefakcie playwright-report."
          fi
          exit "$kod"
      - name: Raport Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7


  # QA kamienia na stagingu: pełne e2e (chromium + webkit) z BASE_URL i Lighthouse, tylko dla PR z
  # gałęzi stage/08-qa i tylko gdy docs/konfiguracja.md ma staging_url. Lokalnie (sandbox Claude Code)
  # przeglądarki nie startują, więc QA czyta wyniki tego joba: gh run view --log-failed i artefakty.
  qa-staging:
    needs: check-dod
    if: (needs.check-dod.outputs.kod == 'true' || needs.check-dod.outputs.e2e == 'true') && startsWith(github.head_ref, 'stage/08-qa')
    runs-on: ${{ fromJSON(vars.SH_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Adres stagingu
        id: staging
        run: |
          url="$(yq --front-matter=extract '.staging_url // ""' docs/konfiguracja.md)"
          if [ -z "$url" ]; then echo "::notice::Brak staging_url w docs/konfiguracja.md, QA na stagingu pominięte."; fi
          echo "url=$url" >>"$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.staging.outputs.url != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.staging.outputs.url != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalacja
        if: steps.staging.outputs.url != ''
        run: pnpm install --frozen-lockfile
      - name: Przeglądarki Playwright (chromium + webkit)
        if: steps.staging.outputs.url != ''
        run: timeout 8m pnpm exec playwright install --with-deps chromium webkit
      - name: E2E na stagingu
        if: steps.staging.outputs.url != ''
        env:
          BASE_URL: ${{ steps.staging.outputs.url }}
        run: timeout 15m pnpm exec playwright test --project=chromium --project=webkit
      - name: Lighthouse na stagingu
        if: steps.staging.outputs.url != '' && (success() || failure())
        env:
          BASE_URL: ${{ steps.staging.outputs.url }}
        run: |
          mkdir -p lighthouse
          timeout 5m npx -y lighthouse@12.8.2 "$BASE_URL" --quiet --chrome-flags="--headless=new" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output=html --output-path=lighthouse/staging
      - name: Raporty QA
        if: steps.staging.outputs.url != '' && (success() || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-staging
          path: |
            playwright-report/
            lighthouse/
          retention-days: 14

  gitleaks:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.SH_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instalacja gitleaks
        run: |
          archiwum="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archiwum" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archiwum}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archiwum" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archiwum" -C "$RUNNER_TEMP" gitleaks
      - name: Skan historii
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'
