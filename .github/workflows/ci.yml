name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint (placeholder)
        run: echo "Placeholder. Zadanie szkieletu wstawia tu lint projektu."

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Testy (placeholder)
        run: echo "Placeholder. Zadanie szkieletu wstawia tu testy projektu."

  testy-skryptow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalacja bats i expect
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats expect
      - name: Testy deploy-prod.sh i check-dod.sh
        run: bats scripts/tests

  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instalacja gitleaks
        run: |
          archiwum="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archiwum" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archiwum}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archiwum" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archiwum" -C "$RUNNER_TEMP" gitleaks
      - name: Skan historii
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'

  check-dod:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: DoD etapów
        run: bash scripts/check-dod.sh
